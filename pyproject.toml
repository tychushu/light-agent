[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-agent"
version = "0.1.0"
description = "A thin OpenAI-compatible LLM to Termux adapter"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
ta = "termux_agent.cli:main"

[tool.setuptools.packages.find]
include = ["termux_agent*"]

[tool.setuptools.package-data]
termux_agent = ["system_prompt.txt"]
