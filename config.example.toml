default_api = "local"
base_url = "http://192.168.86.244:8085/v1"
model = "Qwen3.8-27B-MTPLX-Speed"
max_steps = 16
auto_continue = false
max_continuations = 3
max_subagents = 3 # per parent task; 0 disables delegation
subagent_max_steps = 6 # each child, capped by max_steps; no recursion
web_fetch_enabled = false # optional; needs an existing Lightpanda executable
lightpanda_binary = "" # empty: TERMUX_AGENT_LIGHTPANDA, then PATH; supports ~/bin/lightpanda
rtk_enabled = false # opt-in model-shell output reduction; repository default is off
rtk_binary = "" # empty: TERMUX_AGENT_RTK, then PATH; supports ~/bin/rtk; per-profile override allowed
max_output_chars = 20000 # single tool-output char cap; 128..1000000 (25000 valid); not context tokens
max_input_file_chars = 64000
max_context_chars = 500000 # serialized messages + schemas char guard; default 500000; per-profile override allowed
max_task_calls = 32 # model calls in one logical task, including recovery calls
max_task_seconds = 600.0 # active execution budget; checked at request/tool-batch boundaries
max_task_tokens = 0 # 0 disables the task token cap; otherwise cumulative reported/estimated tokens
auto_extend_segments = false # continue after max_steps only when the segment made progress
auto_compact_task = false # archive-and-branch one task when the threshold is reached
auto_compact_keep_groups = 2 # most recent complete tool groups retained verbatim
auto_compact_threshold = 0.85 # max of character and token-window ratios; 0.5..0.95
context_recovery = false # allow one pre-accept context recovery after a real compaction
no_progress_detection = false # stop repeated identical call/argument/result loops
no_progress_threshold = 3 # consecutive identical tool groups; 2..20
approval_policy = "on-risk"
silent_writes = true
timeout = 120.0
retry_wait_budget = 20.0
retry_max_attempts = 3 # includes the initial request; 1–6, per-profile override allowed
# Defaults to false; enable only for a profile confirmed to return the known error.
# retry_thinking_400 = false
stream = true # set false for APIs without SSE support
wire_api = "chat_completions" # default; "responses" is also supported per profile
max_output_tokens = 0 # provider generation token cap; 0 uses provider default
output_reserve_tokens = 512 # reserve when comparing prompt tokens with context_window_tokens
context_window_tokens = 0 # real model window in tokens; 0 auto-discovers in local mode when available; does not change server capacity
chat_include_usage = false # request usage in Chat Completions SSE when supported
chat_max_tokens_field = "max_completion_tokens" # or "max_tokens" for older compatible APIs
token_count_mode = "estimate" # "estimate", "local" (llama.cpp), or "off"
token_cache_ttl = 86400 # local metadata/tokenizer capability cache seconds
token_metadata_base_url = "" # empty derives the llama.cpp root from base_url
reasoning_effort = "" # empty, low, medium, or high when supported

[apis.local]
base_url = "http://192.168.86.244:8085/v1"
model = "Qwen3.8-27B-MTPLX-Speed"
api_key_env = "TERMUX_AGENT_API_KEY"

[apis.cloud]
base_url = "https://agentrouter.org/v1"
model = "deepseek-v4-flash"
api_key_env = "AGENTROUTER_API_KEY"
user_agent = "claude-cli/2.1.119 (external, cli)"
timeout = 300.0
# Use for an AgentRouter model/route requiring the Responses endpoint:
# wire_api = "responses"
# Per-profile opt-in; uncomment only if this API returns the known error.
# retry_thinking_400 = true
# retry_wait_budget = 20.0
